<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moss Creek Landscaping — Website UI Kit</title>
  <link rel="icon" type="image/png" href="assets/MCL-logo.png" />
  <link rel="apple-touch-icon" href="assets/MCL-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- GoHighLevel external tracking -->
  <script
    src="https://link.msgsndr.com/js/external-tracking.js"
    data-tracking-id="tk_591b295d70be432f94849c7b2be75297"
  ></script>
  <!-- GoHighLevel form embed (handles iframe resize + submit) -->
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: #f4f1eb; }
    #root { display: flex; flex-direction: column; min-height: 100vh; }
    img { max-width: 100%; height: auto; }


    /* ── Mobile (≤ 768px) ─────────────────────────────────────── */
    @media (max-width: 768px) {

      /* Nav: tighten and hide page links (keep logo + Free Estimate) */
      nav { padding: 0 16px !important; height: 64px !important; }
      nav > button:first-child img { width: 36px !important; height: 36px !important; }
      nav > button:first-child div > div:first-child { font-size: 14px !important; }
      nav > button:first-child div > div:last-child { font-size: 7px !important; }
      nav > div { gap: 8px !important; }
      nav > div > button:not(:last-child) { display: none !important; }
      nav > div > button:last-child {
        font-size: 10px !important;
        padding: 8px 14px !important;
      }

      /* Sections: reduce padding everywhere except full-bleed hero */
      section:not([style*="100vh"]) { padding: 56px 20px !important; }

      /* Hero — smaller padding, fluid type */
      section > div[style*="padding: 0 60px"] {
        padding: 0 22px !important;
      }
      section h1 { font-size: clamp(34px, 9vw, 56px) !important; }

      /* Hero/anywhere flex button rows: wrap, full width */
      [style*="display: flex"][style*="gap: 16px"] { flex-wrap: wrap !important; }
      [style*="display: flex"][style*="gap: 16px"] > button { flex: 1 1 100% !important; }

      /* 2-column grids → stack */
      [style*="grid-template-columns: 1fr 1fr"],
      [style*="grid-template-columns:1fr 1fr"] {
        grid-template-columns: 1fr !important;
        gap: 32px !important;
      }

      /* 3-column grids (project gallery, services) → stack */
      [style*="repeat(3, 1fr)"] { grid-template-columns: 1fr !important; }

      /* Inner page header bands */
      [style*="padding: 64px 40px 56px"] {
        padding: 48px 20px 36px !important;
      }
      [style*="padding: 80px 40px 100px"] {
        padding: 56px 20px 72px !important;
      }

      /* Headline scaling for inner pages */
      h2 { font-size: clamp(24px, 6vw, 36px) !important; }

      /* Contact form: shrink padding so it fits */
      #estimate-form { padding: 24px !important; }
      #estimate-form [style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }

      /* CTA banner button: tighter padding */
      [style*="padding: 14px 40px"] { padding: 12px 24px !important; }

      /* Footer brand: hide "Moss Creek Landscaping" text + tagline beside the logo on mobile */
      footer > div > div:first-child > div:first-child > div:last-child { display: none !important; }

      /* Footer bottom row: stack legal links cleanly on mobile */
      footer > div > div:last-child { flex-direction: column !important; align-items: flex-start !important; gap: 10px !important; }
      footer > div > div:last-child > div:last-child { flex-wrap: wrap !important; gap: 8px 12px !important; }

      /* Nav brand: hide subtitle "Richardson, TX & DFW" on mobile so logo + name + button fit */
      nav > button:first-child div > div:last-child { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Services.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    // ── Project Gallery Section ──────────────────────────────
    const ProjectGallery = ({ setPage }) => {
      const projects = [
        { img: '../../assets/pool-hardscape.webp', label: 'Pool Deck & Pavers', loc: 'University Park' },
        { img: '../../assets/rose-arch-garden.webp', label: 'Rose Arch Garden', loc: 'Highland Park' },
        { img: '../../assets/modern-backyard.webp', label: 'Modern Backyard', loc: 'Plano' },
        { img: '../../assets/retaining-wall.webp', label: 'Retaining Wall', loc: 'Richardson' },
        { img: '../../assets/outdoor-kitchen.webp', label: 'Outdoor Kitchen', loc: 'Allen' },
        { img: '../../assets/espalier-wall.webp', label: 'Espalier Feature Wall', loc: 'Frisco' },
      ];

      return (
        <section style={{ background: '#1e3b1e', padding: '80px 40px' }}>
          <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 40 }}>
              <div>
                <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 12 }}>Recent Work</div>
                <h2 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(30px,3.5vw,44px)', fontWeight: 400, color: '#f4f1eb', lineHeight: 1.15 }}>
                  Built across DFW.
                </h2>
              </div>
              <button onClick={() => setPage('Services')} style={{
                fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600,
                letterSpacing: '0.08em', textTransform: 'uppercase',
                background: 'transparent', color: '#f4f1eb',
                border: '2px solid rgba(244,241,235,0.4)', borderRadius: 4,
                padding: '10px 22px', cursor: 'pointer',
              }}>View All Work</button>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 3 }}>
              {projects.map(({ img, label, loc }) => (
                <div key={label} style={{ position: 'relative', aspectRatio: '4/3', overflow: 'hidden', cursor: 'pointer' }}
                  onMouseEnter={e => { e.currentTarget.querySelector('img').style.transform = 'scale(1.06)'; e.currentTarget.querySelector('.overlay').style.opacity = 1; }}
                  onMouseLeave={e => { e.currentTarget.querySelector('img').style.transform = 'scale(1)'; e.currentTarget.querySelector('.overlay').style.opacity = 0; }}
                >
                  <img src={img} alt={label} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', transition: 'transform 500ms ease' }} />
                  <div className="overlay" style={{ position: 'absolute', inset: 0, background: 'rgba(20,45,20,0.6)', opacity: 0, transition: 'opacity 300ms ease', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: 20 }}>
                    <div style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 18, fontWeight: 500, color: '#f4f1eb' }}>{label}</div>
                    <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#a8c49a', marginTop: 4 }}>{loc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ── CTA Banner ───────────────────────────────────────────
    const CTABanner = ({ setPage }) => (
      <section style={{ background: '#ede8dc', padding: '72px 40px', textAlign: 'center', borderTop: '1px solid #c4b99a' }}>
        <div style={{ maxWidth: 600, margin: '0 auto' }}>
          <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 16 }}>Ready to Start?</div>
          <h2 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(28px,4vw,44px)', fontWeight: 400, color: '#1e3b1e', lineHeight: 1.2, marginBottom: 16 }}>
            Your outdoor space is waiting.
          </h2>
          <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, fontStyle: 'italic', color: '#6b4f35', lineHeight: 1.7, marginBottom: 32 }}>
            Free estimates. No pressure. Just a conversation about what your space could become.
          </p>
          <button onClick={() => { setPage('Contact'); setTimeout(() => document.getElementById('estimate-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120); }} style={{
            fontFamily: "'Montserrat', sans-serif", fontSize: 12, fontWeight: 600,
            letterSpacing: '0.08em', textTransform: 'uppercase',
            background: '#2d5626', color: '#f4f1eb',
            border: '2px solid #2d5626', borderRadius: 4,
            padding: '14px 40px', cursor: 'pointer', boxShadow: '0 4px 16px rgba(30,59,30,0.22)',
          }}>Get a Free Estimate</button>
        </div>
      </section>
    );

    // ── Services Page ────────────────────────────────────────
    const ServicesPage = ({ setPage }) => (
      <div style={{ paddingTop: 72 }}>
        <div style={{ background: '#1e3b1e', padding: '64px 40px 56px' }}>
          <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 14 }}>Our Services</div>
            <h1 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(40px,5vw,64px)', fontWeight: 300, color: '#f4f1eb', lineHeight: 1.1 }}>
              What we build.<br /><em>How we work.</em>
            </h1>
          </div>
        </div>
        <ServicesSection full={true} setPage={setPage} />
        <ProjectGallery setPage={setPage} />
        <CTABanner setPage={setPage} />
        <Footer setPage={setPage} />
      </div>
    );

    // ── About Page ───────────────────────────────────────────
    const AboutPage = ({ setPage }) => (
      <div style={{ paddingTop: 72 }}>
        <div style={{ background: '#1e3b1e', padding: '64px 40px 56px' }}>
          <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 14 }}>About Us</div>
            <h1 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(40px,5vw,64px)', fontWeight: 300, color: '#f4f1eb', lineHeight: 1.1 }}>
              Family-rooted.<br /><em>Craft-forward.</em>
            </h1>
          </div>
        </div>
        <AboutSection full={true} setPage={setPage} />
        <CTABanner setPage={setPage} />
        <Footer setPage={setPage} />
      </div>
    );

    // ── Contact Page ─────────────────────────────────────────
    const ContactPageFull = ({ setPage }) => (
      <div style={{ paddingTop: 72 }}>
        <div style={{ background: '#1e3b1e', padding: '64px 40px 56px' }}>
          <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 14 }}>Contact</div>
            <h1 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(40px,5vw,64px)', fontWeight: 300, color: '#f4f1eb', lineHeight: 1.1 }}>
              Start a conversation.
            </h1>
          </div>
        </div>
        <ContactPage />
        <Footer setPage={setPage} />
      </div>
    );

    // ── Home Page Contact Form ───────────────────────────────
    const HomeContactForm = () => (
      <section id="home-estimate-form" style={{ background: '#f4f1eb', padding: '80px 40px', borderTop: '1px solid #e0d9c8' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'start' }}>
          <div>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#6b8c5a', marginBottom: 14 }}>Request a Free Estimate</div>
            <h2 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 'clamp(30px,4vw,46px)', fontWeight: 400, color: '#1e3b1e', lineHeight: 1.15, letterSpacing: '-0.02em', marginBottom: 20 }}>
              Tell us about<br />your project.
            </h2>
            <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, color: '#6b4f35', lineHeight: 1.75, marginBottom: 28 }}>
              Share a few details and we'll be in touch within one business day to schedule a walk-through and provide a detailed estimate.
            </p>
            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#3d2b1f', marginBottom: 8 }}>Or call us directly</div>
            <div style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontSize: 24, color: '#2d5626', marginBottom: 32 }}>(972) 800-0155</div>
            <img
              src="../../assets/home-feature.jpg"
              alt="Curved stone planter bed with mixed pansies — recent Moss Creek project"
              style={{
                width: '100%',
                height: 320,
                objectFit: 'cover',
                borderRadius: 4,
                display: 'block',
                boxShadow: '0 2px 12px rgba(30,59,30,0.12)',
              }}
            />
          </div>
          <div>
            <div style={{
              fontFamily: "'Lora', Georgia, serif", fontSize: 12.5,
              color: '#6b4f35', lineHeight: 1.55, marginBottom: 14,
              padding: '14px 16px', background: '#ede8dc', border: '1px solid #c4b99a', borderRadius: 4,
            }}>
              <strong style={{ display: 'block', fontFamily: "'Montserrat', sans-serif", fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#3d2b1f', marginBottom: 6 }}>SMS Consent</strong>
              <span style={{ fontStyle: 'italic' }}>
                Check the consent box in the form below to receive SMS messages from Moss Creek Landscaping, LLC about your inquiry, appointments, and quotes. Message frequency varies. Message and data rates may apply. Reply STOP to opt out, HELP for help. Consent is not required to purchase services. See our <a href="/privacy-policy" style={{ color: '#2d5626', textDecoration: 'underline' }}>Privacy Policy</a> and <a href="/terms-of-service" style={{ color: '#2d5626', textDecoration: 'underline' }}>Terms of Service</a>.
              </span>
            </div>
            <iframe
              src="https://api.leadconnectorhq.com/widget/form/vjiK7W9QloqY9ug2d8qm"
              style={{ width: '100%', height: 933, border: 'none', borderRadius: 4 }}
              id="inline-vjiK7W9QloqY9ug2d8qm-home"
              data-layout="{'id':'INLINE'}"
              data-trigger-type="alwaysShow"
              data-trigger-value=""
              data-activation-type="alwaysActivated"
              data-activation-value=""
              data-deactivation-type="neverDeactivate"
              data-deactivation-value=""
              data-form-name="Lead Intake Form"
              data-height="933"
              data-layout-iframe-id="inline-vjiK7W9QloqY9ug2d8qm-home"
              data-form-id="vjiK7W9QloqY9ug2d8qm"
              title="Lead Intake Form"
            />
          </div>
        </div>
      </section>
    );

    // ── Home Page ────────────────────────────────────────────
    // Order: Hero → Our Story → Recent Work → What We Do → Contact Form → CTA → Footer
    const HomePage = ({ setPage }) => (
      <div>
        <Hero setPage={setPage} />
        <AboutSection full={false} setPage={setPage} />
        <ProjectGallery setPage={setPage} />
        <ServicesSection full={false} setPage={setPage} />
        <HomeContactForm />
        <CTABanner setPage={setPage} />
        <Footer setPage={setPage} />
      </div>
    );

    // ── App Root ─────────────────────────────────────────────
    const App = () => {
      const [page, setPage] = React.useState('Home');

      // Scroll to top on page change
      React.useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [page]);

      const changePage = (p) => setPage(p);

      return (
        <div>
          <Nav page={page} setPage={changePage} />
          {page === 'Home'     && <HomePage     setPage={changePage} />}
          {page === 'Services' && <ServicesPage setPage={changePage} />}
          {page === 'About'    && <AboutPage    setPage={changePage} />}
          {page === 'Contact'  && <ContactPageFull setPage={changePage} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
